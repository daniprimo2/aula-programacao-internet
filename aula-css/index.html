<!--

Formas de inserir o CSS

ordem de prioridade

- HTML
- CSS Externo
- CSS Incorporado
- CSS Inline


Seletores CSS:

Seletores 
    - Universal: Para todos componentes do html
        Sintaxe: É propriedade e valor
        {propriedade: valor}
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {font-size: 22px}
        p * {color: red;}
    </style>
</head>
<body>
    <p>Paragrafo</p>
    <strong>Negrito</strong><br>
    <em>Itálico</em><br>
    <p>
        <strong>Texto em negrito</strong>
        Normal
        <em>Texto em itálico</em>
    </p>
    Texto do body
    <strong>Negrito normal</strong>
</body>
</html>
