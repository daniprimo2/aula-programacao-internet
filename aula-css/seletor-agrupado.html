<!--
   - Seletor Agrupado para varios tipos: Ativar por tipo da tag
-->


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        p, h1, h2 {
            color: blue;
            font-family: verdana;
            text-align: center;
        }
        body {
            color: green;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <h1>Seletor Agrupado</h1>

    <p>Paragrafo</p>
    <h1>Texto H1</h1>
    <h2>Texto H2</h2>
<hr><hr><br>
</body>
</html>
