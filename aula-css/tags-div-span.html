<!--
    Tags semanticas DIV, SPAN  para serem usadsa e 
    manipuladas da maneira que eu quiser 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .caixa {
            border: 3px solid #ff0000;
            background-color: #cccccc;
            color: red;
        }

        #aviso {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <p>Parágrafo 1</p>
    <div>Utilizando a tag div sem formatação</div>
    <div class="caixa" id="aviso">Utilização da taf com formatação</div>
    <br>
    <span>Texto do body com a tag span sem nada</span>
    <br>
    <span class="caixa">Texto do body com a tag span e classe de estilo</span>
</body>
</html>
