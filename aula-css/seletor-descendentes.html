   - Seletor descedentes a herança: posso buscar especifico
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        div p {
            color: blue;
        }

        p strong {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Seletores com herança</h1>

    <div>
        <p>Paragrafo dentro da div</p>
    </div>

    <p>parágrafo fora da div</p>
    
    <strong>Negrito normal</strong>
    
    <div>
        <span>Texto <p>Paragráfo dentro da div e dentro da span</p></span>
    </div>
    
    <p><strong>Negrito dentro da tag p</strong></p>
</body>
</html>
